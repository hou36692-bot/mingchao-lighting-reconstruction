<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 670" width="1600" height="670" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Module map: five reconstructed modules and where they sit</title>
  <desc id="dsc">MPC_RestoreControl holds the switches at the top. Shadows, clustered lighting, water and vegetation work inside the engine's own passes and reach SceneColor before post-process. The custom AO material inserts before bloom, and a debug overlay reads the tonemapped image. A banner states the Material plus Custom HLSL boundary.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#57606A"/>
    </marker>
    <marker id="arDash" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#8C959F"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #F7F8FA; }
    .tt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #161B22; }
    .h1 { font-size: 24px; font-weight: 700; }
    .sub { font-size: 12px; fill: #57606A; }
    .sec { font-size: 10.5px; font-weight: 700; letter-spacing: .10em; fill: #6E7781; }
    .st { font-size: 12.5px; font-weight: 700; }
    .ss { font-size: 10.2px; fill: #57606A; }
    .monos { font-family: Consolas, SFMono-Regular, Menlo, monospace; font-size: 9.4px; fill: #57606A; }
    .leg { font-size: 10.5px; fill: #3D444D; }
    .drv { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.4; }
    .mod { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.4; }
    .ppAO { fill: #F4F8FF; stroke: #1F6FEB; stroke-width: 1.7; }
    .engine { fill: #F2F3F5; stroke: #8C959F; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .dbg { fill: #FFF9F2; stroke: #BC4C00; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .pill { fill: #EAF2FF; stroke: #7FA9F0; stroke-width: 1; }
    .pillN { fill: #ECEEF1; stroke: #9AA4AE; stroke-width: 1; }
    .pillO { fill: #FFEEDC; stroke: #D79B63; stroke-width: 1; }
    .chip { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.2; }
    .flow { stroke: #57606A; stroke-width: 1.8; fill: none; }
    .rail { stroke: #57606A; stroke-width: 1.3; fill: none; }
    .dash { stroke: #8C959F; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="670"/>

  <text class="tt h1" x="40" y="42">Module map — five reconstructed modules and where they sit</text>
  <text class="tt sub" x="40" y="64">Four modules work inside engine passes and reach SceneColor directly. Only AO adds a post-process material of its own.</text>

  <!-- ===== row 1: control ===== -->
  <text class="tt sec" x="40" y="96">CONTROL</text>
  <g>
    <rect class="drv" x="40" y="104" width="1520" height="68" rx="6"/>
    <text class="tt st" x="56" y="126">MPC_RestoreControl — scalars read by the restore materials (0 = engine default, 1 = reconstructed)</text>
    <rect class="chip" x="56" y="136" width="230" height="26" rx="4"/>
    <text class="tt monos" x="66" y="153">Enable_Custom_AO</text>
    <text class="tt monos" x="276" y="153" text-anchor="end">0/1</text>
    <rect class="chip" x="298" y="136" width="250" height="26" rx="4"/>
    <text class="tt monos" x="308" y="153">AO_Radius · AO_Intensity</text>
    <rect class="chip" x="560" y="136" width="200" height="26" rx="4"/>
    <text class="tt monos" x="570" y="153">Debug_Viz_Mode</text>
    <text class="tt monos" x="750" y="153" text-anchor="end">0–3</text>
    <rect class="chip" x="772" y="136" width="290" height="26" rx="4"/>
    <text class="tt monos" x="782" y="153">CSM_UE_*</text>
    <text class="tt monos" x="1052" y="153" text-anchor="end">written by ue_csm_mode.py</text>
    <rect class="chip" x="1074" y="136" width="250" height="26" rx="4"/>
    <text class="tt monos" x="1084" y="153">Enable_Water_Absorb</text>
    <text class="tt monos" x="1314" y="153" text-anchor="end">mirror</text>
    <text class="tt ss" x="1340" y="146">water switch lives on</text>
    <text class="tt ss" x="1340" y="160">MI_Water_Restore_SLW</text>
  </g>

  <!-- ===== row 2: lighting and geometry ===== -->
  <text class="tt sec" x="40" y="196">LIGHTING AND GEOMETRY</text>
  <g>
    <rect class="mod" x="40" y="204" width="365" height="120" rx="6"/>
    <text class="tt st" x="56" y="228">CSM shadows — parameter match</text>
    <text class="tt ss" x="56" y="250">engine 5×5 PCF, 5 cascades</text>
    <text class="tt ss" x="56" y="268">split distances fitted with csm_fit.mjs</text>
    <text class="tt ss" x="56" y="286">VSM kept as the baseline</text>
    <text class="tt monos" x="56" y="310">no custom shadow sampling</text>
  </g>
  <g>
    <rect class="mod" x="425" y="204" width="365" height="120" rx="6"/>
    <text class="tt st" x="441" y="228">Clustered lighting — parameter match</text>
    <text class="tt ss" x="441" y="250">engine light grid, 35 source lights</text>
    <text class="tt ss" x="441" y="268">CPU replica compared per pixel</text>
    <text class="tt ss" x="441" y="286">grid size and slices are engine defaults</text>
    <text class="tt monos" x="441" y="310">no custom culling pass</text>
  </g>
  <g>
    <rect class="mod" x="810" y="204" width="365" height="120" rx="6"/>
    <text class="tt st" x="826" y="228">Water surface</text>
    <text class="tt ss" x="826" y="250">Single Layer Water with source coefficients</text>
    <text class="tt ss" x="826" y="268">copied material instance + switch</text>
    <text class="tt ss" x="826" y="286">normals unchanged (no FFT waves)</text>
    <text class="tt monos" x="826" y="310">material domain, not post-process</text>
  </g>
  <g>
    <rect class="mod" x="1195" y="204" width="365" height="120" rx="6"/>
    <text class="tt st" x="1211" y="228">Vegetation</text>
    <text class="tt ss" x="1211" y="250">2 source grass meshes rebuilt</text>
    <text class="tt ss" x="1211" y="268">procedural placement, re-grounded</text>
    <text class="tt ss" x="1211" y="286">colour calibrated on grass pixels only</text>
    <text class="tt monos" x="1211" y="310">geometry and material, no new pass</text>
  </g>

  <!-- rail into SceneColor -->
  <path class="rail" d="M222,324 V350"/>
  <path class="rail" d="M607,324 V350"/>
  <path class="rail" d="M992,324 V350"/>
  <path class="rail" d="M1377,324 V350"/>
  <path class="rail" d="M180,350 H1377"/>
  <path class="flow" d="M180,350 V396" marker-end="url(#ar)"/>
  <text class="tt ss" x="200" y="376">all four reach SceneColor before post-process</text>

  <!-- ===== row 3: post chain ===== -->
  <text class="tt sec" x="40" y="392">POST</text>
  <g>
    <rect class="mod" x="40" y="400" width="170" height="100" rx="6"/>
    <text class="tt st" x="56" y="424">SceneColor</text>
    <rect class="pill pillN" x="56" y="432" width="70" height="18" rx="9"/>
    <text class="tt monos" x="91" y="445" text-anchor="middle">in</text>
    <text class="tt ss" x="56" y="474">linear HDR</text>
  </g>
  <path class="flow" d="M214,450 H226" marker-end="url(#ar)"/>

  <g>
    <rect class="ppAO" x="230" y="400" width="260" height="100" rx="6"/>
    <text class="tt st" x="246" y="424">M_PP_CustomAO</text>
    <rect class="pill" x="246" y="432" width="86" height="18" rx="9"/>
    <text class="tt monos" x="289" y="445" text-anchor="middle">Before Bloom</text>
    <text class="tt ss" x="246" y="470">8 directions × 4 steps, single pass</text>
    <text class="tt monos" x="246" y="488">MPC Enable_Custom_AO</text>
  </g>
  <path class="flow" d="M494,450 H506" marker-end="url(#ar)"/>

  <g>
    <rect class="engine" x="510" y="400" width="220" height="100" rx="6"/>
    <text class="tt st" x="526" y="424">Bloom + tonemapper</text>
    <rect class="pill pillN" x="526" y="432" width="86" height="18" rx="9"/>
    <text class="tt monos" x="569" y="445" text-anchor="middle">engine pass</text>
    <text class="tt ss" x="526" y="474">HDR -&gt; display</text>
  </g>
  <path class="flow" d="M734,450 H746" marker-end="url(#ar)"/>

  <g>
    <rect class="mod" x="750" y="400" width="170" height="100" rx="6"/>
    <text class="tt st" x="766" y="424">Backbuffer</text>
    <rect class="pill pillN" x="766" y="432" width="70" height="18" rx="9"/>
    <text class="tt monos" x="801" y="445" text-anchor="middle">out</text>
    <text class="tt ss" x="766" y="474">present</text>
  </g>

  <g>
    <rect class="dbg" x="1000" y="400" width="560" height="100" rx="6"/>
    <text class="tt st" x="1016" y="424">M_PP_RestoreDebugViz</text>
    <rect class="pill pillO" x="1016" y="432" width="118" height="18" rx="9"/>
    <text class="tt monos" x="1075" y="445" text-anchor="middle">After Tonemapping</text>
    <text class="tt ss" x="1016" y="470">source vs UE cascade bands · 64 px light-grid cells</text>
    <text class="tt monos" x="1016" y="488">MPC Debug_Viz_Mode (0 in normal shots)</text>
  </g>

  <!-- debug tap -->
  <path class="dash" d="M620,500 V518 H1280 V504" marker-end="url(#arDash)"/>
  <text class="tt ss" x="700" y="536">debug overlay reads the tonemapped image; nothing is recomputed</text>

  <!-- ===== boundary banner ===== -->
  <rect x="40" y="556" width="1520" height="56" rx="6" fill="#FFFFFF" stroke="#BC4C00" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text class="tt st" x="58" y="580">Implementation boundary — Material + Custom HLSL only; no engine source changes</text>
  <text class="tt ss" x="58" y="600">No compute shaders and no custom render passes. Everything lives in _Restore/ inside a copy of the level; the original level is untouched.</text>

  <!-- ===== legend ===== -->
  <g transform="translate(40,644)">
    <rect x="0" y="-10" width="24" height="15" rx="2" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.4"/>
    <text class="tt leg" x="32" y="2">our asset or setting</text>
    <rect x="170" y="-10" width="24" height="15" rx="2" fill="#F2F3F5" stroke="#8C959F" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text class="tt leg" x="202" y="2">engine pass (read-only)</text>
    <rect x="380" y="-10" width="24" height="15" rx="2" fill="#FFF9F2" stroke="#BC4C00" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="tt leg" x="412" y="2">debug output</text>
    <rect x="530" y="-11" width="30" height="17" rx="8" fill="#EAF2FF" stroke="#7FA9F0"/>
    <text class="tt leg" x="568" y="2">insertion point</text>
    <text class="tt leg" x="710" y="2" fill="#57606A">solid arrow = SceneColor flow · dashed arrow = read-only tap</text>
  </g>
</svg>
