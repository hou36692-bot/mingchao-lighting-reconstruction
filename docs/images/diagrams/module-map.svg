<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Module map: eight reconstructed terms and their insertion points</title>
  <desc id="dsc">Scene drivers at the top, base-pass lighting and geometry in the middle, and the SceneColor post-process chain at the bottom. SH ambient and custom AO insert before bloom, the LUT inserts after tonemapping, and every module is toggled by a scalar in MPC_RestoreControl. A banner states the Material plus Custom HLSL boundary.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#57606A"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1F6FEB"/>
    </marker>
    <marker id="arDash" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#8C959F"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #F7F8FA; }
    .tt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #161B22; }
    .h1 { font-size: 24px; font-weight: 700; }
    .sub { font-size: 12px; fill: #57606A; }
    .sec { font-size: 10.5px; font-weight: 700; letter-spacing: .10em; fill: #6E7781; }
    .st { font-size: 12.5px; font-weight: 700; }
    .ss { font-size: 10.2px; fill: #57606A; }
    .mono { font-family: Consolas, SFMono-Regular, Menlo, monospace; font-size: 9.7px; fill: #24292F; }
    .monos { font-family: Consolas, SFMono-Regular, Menlo, monospace; font-size: 9.4px; fill: #57606A; }
    .leg { font-size: 10.5px; fill: #3D444D; }
    .drv { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.4; }
    .mod { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.4; }
    .ppSH { fill: #F4F8FF; stroke: #1F6FEB; stroke-width: 1.7; }
    .ppAO { fill: #F4F8FF; stroke: #1F6FEB; stroke-width: 1.7; }
    .ppLUT { fill: #F2FBF5; stroke: #1A7F37; stroke-width: 1.7; }
    .engine { fill: #F2F3F5; stroke: #8C959F; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .dbg { fill: #FFF9F2; stroke: #BC4C00; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .pill { fill: #EAF2FF; stroke: #7FA9F0; stroke-width: 1; }
    .pillG { fill: #DFF3E7; stroke: #7FBF98; stroke-width: 1; }
    .pillN { fill: #ECEEF1; stroke: #9AA4AE; stroke-width: 1; }
    .pillO { fill: #FFEEDC; stroke: #D79B63; stroke-width: 1; }
    .chip { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.2; }
    .flow { stroke: #57606A; stroke-width: 1.8; fill: none; }
    .rail { stroke: #57606A; stroke-width: 1.3; fill: none; }
    .dash { stroke: #8C959F; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="760"/>

  <text class="tt h1" x="40" y="42">Module map — eight reconstructed terms and where they are inserted</text>
  <text class="tt sub" x="40" y="64">SceneColor flows left to right. Every module has one scalar in MPC_RestoreControl: 0 = bypass, 1 = reconstructed term.</text>

  <text class="tt sec" x="40" y="96">DRIVERS</text>

  <!-- ===== row 1: drivers ===== -->
  <g>
    <rect class="drv" x="40" y="104" width="330" height="72" rx="6"/>
    <text class="tt st" x="56" y="128">TOD controller</text>
    <text class="tt ss" x="56" y="146">BP_EnvironmentTOD -&gt; MPC_TODEnvironment</text>
    <text class="tt monos" x="56" y="164">sun / sky ratio 1.35 · sun colour readback</text>
  </g>
  <g>
    <rect class="drv" x="392" y="104" width="300" height="72" rx="6"/>
    <text class="tt st" x="408" y="128">Sky ambient source</text>
    <text class="tt ss" x="408" y="146">SkyLight SH: L0 + SH0..SH6 (7 × float4)</text>
    <text class="tt monos" x="408" y="164">projected from the level sky</text>
  </g>
  <g>
    <rect class="drv" x="714" y="104" width="846" height="72" rx="6"/>
    <text class="tt st" x="730" y="126">MPC_RestoreControl — scalar switches</text>
    <g>
      <rect class="chip" x="730" y="134" width="190" height="26" rx="4"/>
      <text class="tt monos" x="740" y="151">Enable_SH_Ambient</text>
      <text class="tt monos" x="906" y="151" text-anchor="end">0/1</text>
      <rect class="chip" x="932" y="134" width="190" height="26" rx="4"/>
      <text class="tt monos" x="942" y="151">Enable_Custom_AO</text>
      <text class="tt monos" x="1108" y="151" text-anchor="end">0/1</text>
      <rect class="chip" x="1134" y="134" width="190" height="26" rx="4"/>
      <text class="tt monos" x="1144" y="151">Enable_LUT</text>
      <text class="tt monos" x="1310" y="151" text-anchor="end">0/1</text>
      <rect class="chip" x="1336" y="134" width="190" height="26" rx="4"/>
      <text class="tt monos" x="1346" y="151">Enable_Water_Absorb</text>
      <text class="tt monos" x="1512" y="151" text-anchor="end">0/1</text>
    </g>
  </g>

  <!-- driver arrows -->
  <path class="rail" d="M205,176 V193 H585"/>
  <path class="flow" d="M205,193 V226" marker-end="url(#ar)"/>
  <path class="flow" d="M585,193 V226" marker-end="url(#ar)"/>
  <text class="tt ss" x="300" y="208">sun direction, intensity and sky colour feed both</text>

  <!-- ===== row 2: base pass ===== -->
  <g>
    <rect class="mod" x="40" y="230" width="350" height="132" rx="6"/>
    <text class="tt st" x="56" y="254">CSM shadows — parameter match</text>
    <text class="tt monos" x="56" y="276">5 cascades: 737 / 2366 / 6016 / 14190 / 32500 cm</text>
    <text class="tt ss" x="56" y="296">Engine 5x5 PCF kept; VSM kept for comparison</text>
    <text class="tt ss" x="56" y="314">csm_fit.mjs: -8% .. +18% vs source splits</text>
    <text class="tt monos" x="56" y="340">no custom shadow sampling</text>
  </g>
  <g>
    <rect class="mod" x="410" y="230" width="350" height="132" rx="6"/>
    <text class="tt st" x="426" y="254">Clustered lighting — parameter match</text>
    <text class="tt monos" x="426" y="276">engine light grid · 35 lights · packing checked</text>
    <text class="tt ss" x="426" y="296">91.9% of pixels identical, rest ±1</text>
    <text class="tt ss" x="426" y="314">slice formula matches the source frame</text>
    <text class="tt monos" x="426" y="340">no custom culling pass</text>
  </g>
  <g>
    <rect class="mod" x="780" y="230" width="350" height="132" rx="6"/>
    <text class="tt st" x="796" y="254">Water surface</text>
    <text class="tt monos" x="796" y="276">SLW normals + Beer-Lambert absorption</text>
    <text class="tt ss" x="796" y="296">Material domain, not a post-process term</text>
    <text class="tt ss" x="796" y="314">foam, caustics and ripples from project assets</text>
    <text class="tt monos" x="796" y="340">MPC Enable_Water_Absorb</text>
  </g>
  <g>
    <rect class="mod" x="1150" y="230" width="410" height="132" rx="6"/>
    <text class="tt st" x="1166" y="254">Vegetation</text>
    <text class="tt monos" x="1166" y="276">2 source meshes: 10,374 + 5,633 instances</text>
    <text class="tt ss" x="1166" y="296">1,735 plants seeded along the shore</text>
    <text class="tt ss" x="1166" y="314">instanced static meshes, geometry not shading</text>
    <text class="tt monos" x="1166" y="340">status: implemented, pending final viewport pass</text>
  </g>

  <!-- rail into SceneColor -->
  <path class="rail" d="M215,362 V382"/>
  <path class="rail" d="M585,362 V382"/>
  <path class="rail" d="M955,362 V382"/>
  <path class="rail" d="M1355,362 V382"/>
  <path class="rail" d="M115,382 H1355"/>
  <path class="flow" d="M115,382 V402" marker-end="url(#ar)"/>
  <text class="tt ss" x="400" y="375" text-anchor="middle">all lighting terms reach SceneColor before post-process</text>

  <!-- ===== row 3: post chain ===== -->
  <g>
    <rect class="mod" x="40" y="408" width="150" height="112" rx="6"/>
    <text class="tt st" x="54" y="432">SceneColor</text>
    <rect class="pill pillN" x="54" y="440" width="70" height="18" rx="9"/>
    <text class="tt monos" x="89" y="453" text-anchor="middle">in</text>
    <text class="tt ss" x="54" y="478">HDR, post base</text>
  </g>
  <path class="flow" d="M194,464 H206" marker-end="url(#ar)"/>

  <g>
    <rect class="ppSH" x="210" y="408" width="205" height="112" rx="6"/>
    <text class="tt st" x="224" y="432">M_PP_SH_Ambient</text>
    <rect class="pill" x="224" y="440" width="86" height="18" rx="9"/>
    <text class="tt monos" x="267" y="453" text-anchor="middle">Before Bloom</text>
    <text class="tt ss" x="224" y="478">SH irradiance × albedo</text>
    <text class="tt monos" x="224" y="500">MPC Enable_SH_Ambient</text>
  </g>
  <path class="flow" d="M419,464 H431" marker-end="url(#ar)"/>

  <g>
    <rect class="ppAO" x="435" y="408" width="195" height="112" rx="6"/>
    <text class="tt st" x="449" y="432">M_PP_CustomAO</text>
    <rect class="pill" x="449" y="440" width="86" height="18" rx="9"/>
    <text class="tt monos" x="492" y="453" text-anchor="middle">Before Bloom</text>
    <text class="tt ss" x="449" y="478">8 × 4 taps, 150 cm</text>
    <text class="tt monos" x="449" y="500">MPC Enable_Custom_AO</text>
  </g>
  <path class="flow" d="M634,464 H646" marker-end="url(#ar)"/>

  <g>
    <rect class="engine" x="650" y="408" width="170" height="112" rx="6"/>
    <text class="tt st" x="664" y="432">Tonemapper</text>
    <rect class="pill pillN" x="664" y="440" width="86" height="18" rx="9"/>
    <text class="tt monos" x="707" y="453" text-anchor="middle">engine pass</text>
    <text class="tt ss" x="664" y="478">ACES / project curve</text>
    <text class="tt ss" x="664" y="496">HDR -&gt; display</text>
  </g>
  <path class="flow" d="M824,464 H836" marker-end="url(#ar)"/>

  <g>
    <rect class="ppLUT" x="840" y="408" width="195" height="112" rx="6"/>
    <text class="tt st" x="854" y="432">M_PP_LUT</text>
    <rect class="pill pillG" x="854" y="440" width="118" height="18" rx="9"/>
    <text class="tt monos" x="913" y="453" text-anchor="middle">After Tonemapping</text>
    <text class="tt ss" x="854" y="478">32³ strip, 1024 × 32</text>
    <text class="tt monos" x="854" y="500">MPC Enable_LUT</text>
  </g>
  <path class="flow" d="M1039,464 H1051" marker-end="url(#ar)"/>

  <g>
    <rect class="mod" x="1055" y="408" width="150" height="112" rx="6"/>
    <text class="tt st" x="1069" y="432">Backbuffer</text>
    <rect class="pill pillN" x="1069" y="440" width="70" height="18" rx="9"/>
    <text class="tt monos" x="1104" y="453" text-anchor="middle">out</text>
    <text class="tt ss" x="1069" y="478">present</text>
  </g>

  <g>
    <rect class="dbg" x="1225" y="408" width="335" height="112" rx="6"/>
    <text class="tt st" x="1239" y="432">M_PP_RestoreDebugViz</text>
    <rect class="pill pillO" x="1239" y="440" width="96" height="18" rx="9"/>
    <text class="tt monos" x="1287" y="453" text-anchor="middle">debug views</text>
    <text class="tt ss" x="1239" y="478">AO · SH · CSM bands · cluster grid</text>
    <text class="tt monos" x="1239" y="500">MPC DebugView (read-only taps)</text>
  </g>

  <!-- debug bus -->
  <path class="dash" d="M312,520 V548 H1392 V524" marker-end="url(#arDash)"/>
  <path class="dash" d="M532,520 V548"/>
  <text class="tt ss" x="620" y="542">debug taps read the same passes; nothing is recomputed</text>

  <!-- ===== boundary banner ===== -->
  <rect x="40" y="594" width="1520" height="72" rx="6" fill="#FFFFFF" stroke="#BC4C00" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text class="tt st" x="58" y="620">Implementation boundary — Material + Custom HLSL only; no engine source changes</text>
  <text class="tt ss" x="58" y="640">No compute shaders and no custom render passes. CSM and clustered lighting are parameter-matched views of engine passes, not reimplementations.</text>
  <text class="tt ss" x="58" y="657">Everything on this page lives in _Restore/ inside the reverse-lighting level; the original level is untouched.</text>

  <!-- ===== legend ===== -->
  <g transform="translate(40,700)">
    <rect x="0" y="-10" width="24" height="15" rx="2" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.4"/>
    <text class="tt leg" x="32" y="2">our asset</text>
    <rect x="120" y="-10" width="24" height="15" rx="2" fill="#F2F3F5" stroke="#8C959F" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text class="tt leg" x="152" y="2">engine pass (read-only)</text>
    <rect x="330" y="-10" width="24" height="15" rx="2" fill="#FFF9F2" stroke="#BC4C00" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="tt leg" x="362" y="2">debug output</text>
    <rect x="480" y="-11" width="30" height="17" rx="8" fill="#EAF2FF" stroke="#7FA9F0"/>
    <text class="tt leg" x="518" y="2">insertion point</text>
    <text class="tt leg" x="660" y="2" fill="#57606A">solid arrow = SceneColor flow · dashed arrow = read-only tap</text>
  </g>
</svg>
