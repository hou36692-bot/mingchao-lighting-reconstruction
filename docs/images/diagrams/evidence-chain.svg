<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Evidence chain: capture, shader, source match, implementation, verification</title>
  <desc id="dsc">Seven stages from a RenderDoc capture of the source frame to a GPU-versus-CPU verified UE 5.8 material, with the artifacts exchanged at each step. Solid borders mark facts, dashed borders mark inference, dotted borders mark art-directed choices, and a dashed return path lists the scope boundaries.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#57606A"/>
    </marker>
    <marker id="arDash" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#57606A"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #F7F8FA; }
    .tt  { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #161B22; }
    .h1  { font-size: 24px; font-weight: 700; }
    .sub { font-size: 12px; fill: #57606A; }
    .tag { font-size: 9px; font-weight: 700; letter-spacing: .09em; }
    .st  { font-size: 12px; font-weight: 700; }
    .ss  { font-size: 10.2px; fill: #57606A; }
    .mono { font-family: Consolas, SFMono-Regular, Menlo, monospace; font-size: 9.7px; fill: #24292F; }
    .leg { font-size: 10.5px; fill: #3D444D; }
    .boxFact { fill: #FFFFFF; stroke: #1F6FEB; stroke-width: 1.7; }
    .boxInf  { fill: #F1FAF5; stroke: #1A7F37; stroke-width: 1.7; stroke-dasharray: 7 4; }
    .boxArt  { fill: #FFF6EC; stroke: #BC4C00; stroke-width: 1.9; stroke-dasharray: 2 4; stroke-linecap: round; }
    .chipFact { fill: #EAF2FF; }
    .chipInf  { fill: #DFF3E7; }
    .chipArt  { fill: #FFE9D6; }
    .tagFact { fill: #1257C4; }
    .tagInf  { fill: #146B33; }
    .tagArt  { fill: #9A3F00; }
    .arrow { stroke: #57606A; stroke-width: 1.5; fill: none; }
    .dash  { stroke: #57606A; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="420"/>

  <text class="tt h1" x="40" y="42">Evidence chain — from a capture to a verified shader</text>
  <text class="tt sub" x="40" y="66">Worked example: custom screen-space AO. Each stage hands a file or a number to the next one, so every link can be reopened.</text>

  <!-- legend -->
  <g transform="translate(1010,52)">
    <rect x="0" y="-9" width="22" height="14" class="boxFact" rx="2"/>
    <text class="tt leg" x="28" y="3">fact</text>
    <rect x="92" y="-9" width="22" height="14" class="boxInf" rx="2"/>
    <text class="tt leg" x="120" y="3">inference</text>
    <rect x="212" y="-9" width="22" height="14" class="boxArt" rx="2"/>
    <text class="tt leg" x="240" y="3">art / design choice</text>
  </g>

  <!-- ===== stage 1 ===== -->
  <g>
    <rect x="40" y="96" width="194" height="96" class="boxFact" rx="6"/>
    <rect x="196" y="104" width="30" height="15" rx="3" class="chipFact"/>
    <text class="tt tag tagFact" x="211" y="115" text-anchor="middle">FACT</text>
    <text class="tt st" x="54" y="122">1 · RDC capture</text>
    <text class="tt ss" x="54" y="139">source frame, 4K</text>
    <line x1="54" y1="150" x2="220" y2="150" stroke="#D8DEE6"/>
    <text class="tt mono" x="54" y="167">in  frame_61250.rdc</text>
    <text class="tt mono" x="54" y="181">out 1 frame, all events</text>
  </g>
  <line class="arrow" x1="238" y1="144" x2="252" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 2 ===== -->
  <g>
    <rect x="260" y="96" width="194" height="96" class="boxFact" rx="6"/>
    <rect x="416" y="104" width="30" height="15" rx="3" class="chipFact"/>
    <text class="tt tag tagFact" x="431" y="115" text-anchor="middle">FACT</text>
    <text class="tt st" x="274" y="122">2 · Events + PS</text>
    <text class="tt ss" x="274" y="139">pipeline walk, disassembly</text>
    <line x1="274" y1="150" x2="440" y2="150" stroke="#D8DEE6"/>
    <text class="tt mono" x="274" y="167">in  E21239 -&gt; ps1563</text>
    <text class="tt mono" x="274" y="181">out PS disasm + regs</text>
  </g>
  <line class="arrow" x1="458" y1="144" x2="472" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 3 ===== -->
  <g>
    <rect x="480" y="96" width="194" height="96" class="boxFact" rx="6"/>
    <rect x="636" y="104" width="30" height="15" rx="3" class="chipFact"/>
    <text class="tt tag tagFact" x="651" y="115" text-anchor="middle">FACT</text>
    <text class="tt st" x="494" y="122">3 · Constants/buffers</text>
    <text class="tt ss" x="494" y="139">CB / SRV dumps</text>
    <line x1="494" y1="150" x2="660" y2="150" stroke="#D8DEE6"/>
    <text class="tt mono" x="494" y="167">in  buf_2315717_full.txt</text>
    <text class="tt mono" x="494" y="181">out radius 15, strength 4</text>
  </g>
  <line class="arrow" x1="678" y1="144" x2="692" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 4 ===== -->
  <g>
    <rect x="700" y="96" width="194" height="96" class="boxInf" rx="6"/>
    <rect x="854" y="104" width="32" height="15" rx="3" class="chipInf"/>
    <text class="tt tag tagInf" x="870" y="115" text-anchor="middle">INFER</text>
    <text class="tt st" x="714" y="122">4 · UE 5.8 source</text>
    <text class="tt ss" x="714" y="139">same math, same units</text>
    <line x1="714" y1="150" x2="880" y2="150" stroke="#CFE6D8"/>
    <text class="tt mono" x="714" y="167">in  &lt;UE_ENGINE&gt;/shaders</text>
    <text class="tt mono" x="714" y="181">out matching formula</text>
  </g>
  <line class="arrow" x1="898" y1="144" x2="912" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 5 ===== -->
  <g>
    <rect x="920" y="96" width="194" height="96" class="boxInf" rx="6"/>
    <rect x="1074" y="104" width="32" height="15" rx="3" class="chipInf"/>
    <text class="tt tag tagInf" x="1090" y="115" text-anchor="middle">INFER</text>
    <text class="tt st" x="934" y="122">5 · CPU reference</text>
    <text class="tt ss" x="934" y="139">independent model</text>
    <line x1="934" y1="150" x2="1100" y2="150" stroke="#CFE6D8"/>
    <text class="tt mono" x="934" y="167">in  depth + normals</text>
    <text class="tt mono" x="934" y="181">out ao 0..1 per pixel</text>
  </g>
  <line class="arrow" x1="1118" y1="144" x2="1132" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 6 ===== -->
  <g>
    <rect x="1140" y="96" width="194" height="96" class="boxArt" rx="6"/>
    <rect x="1294" y="104" width="32" height="15" rx="3" class="chipArt"/>
    <text class="tt tag tagArt" x="1310" y="115" text-anchor="middle">ART</text>
    <text class="tt st" x="1154" y="122">6 · UE material / level</text>
    <text class="tt ss" x="1154" y="139">Material + Custom HLSL</text>
    <line x1="1154" y1="150" x2="1320" y2="150" stroke="#F3D5BB"/>
    <text class="tt mono" x="1154" y="167">in  HLSL + MPC scalars</text>
    <text class="tt mono" x="1154" y="181">out M_PP_CustomAO</text>
  </g>
  <line class="arrow" x1="1338" y1="144" x2="1352" y2="144" marker-end="url(#ar)"/>

  <!-- ===== stage 7 ===== -->
  <g>
    <rect x="1360" y="96" width="194" height="96" class="boxFact" rx="6"/>
    <rect x="1516" y="104" width="30" height="15" rx="3" class="chipFact"/>
    <text class="tt tag tagFact" x="1531" y="115" text-anchor="middle">FACT</text>
    <text class="tt st" x="1374" y="122">7 · GPU / CPU verify</text>
    <text class="tt ss" x="1374" y="139">same pixels, both sides</text>
    <line x1="1374" y1="150" x2="1540" y2="150" stroke="#D8DEE6"/>
    <text class="tt mono" x="1374" y="167">in  GPU image vs ao_ref</text>
    <text class="tt mono" x="1374" y="181">out mean 4e-4, max .042</text>
  </g>

  <!-- ===== evidence notes under the row ===== -->
  <g class="tt mono" fill="#3D444D">
    <text x="40" y="220">1 frame_61250.rdc</text>
    <text x="40" y="236">D5 · 4K · single frame</text>
    <text x="40" y="252">captured with RenderDoc 1.45</text>

    <text x="260" y="220">rd_events.py, rd_ps_dump.py</text>
    <text x="260" y="236">PS resource table + t/cb slots</text>
    <text x="260" y="252">register map per instruction</text>

    <text x="480" y="220">buf_2315717_full.txt</text>
    <text x="480" y="236">cb0[28].x = 15 (radius)</text>
    <text x="480" y="252">step ladder 1/36 .. 1/6</text>

    <text x="700" y="220">PostProcessAmbientOcclusion.usf</text>
    <text x="700" y="236">UE CSM: Manual5x5PCF</text>
    <text x="700" y="252">light grid packing matches</text>

    <text x="920" y="220">ao_ref.mjs, ao_test.mjs</text>
    <text x="920" y="236">32 taps, same skip rules</text>
    <text x="920" y="252">numeric, no GPU involved</text>

    <text x="1140" y="220">MPC &gt; Enable_Custom_AO</text>
    <text x="1140" y="236">_Restore/AO/M_PP_CustomAO</text>
    <text x="1140" y="252">radius 150 cm, intensity 4</text>

    <text x="1360" y="220">ao_gpu_compare.mjs</text>
    <text x="1360" y="236">mean 0.0004 · max 0.042</text>
    <text x="1360" y="252">delta reported in 0..1 units</text>
  </g>

  <!-- ===== dashed return path to boundaries ===== -->
  <path class="dash" d="M1457,192 L1457,280 L520,280 L520,300" marker-end="url(#arDash)"/>
  <text class="tt leg" x="1030" y="272" text-anchor="middle">what the chain cannot prove</text>

  <!-- boundaries node -->
  <g>
    <rect x="40" y="306" width="560" height="86" rx="6" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.4"/>
    <text class="tt st" x="56" y="330">Scope boundaries · docs/boundaries.md</text>
    <text class="tt ss" x="56" y="350">No engine source changes · no source data redistributed · no pixel-level match claimed.</text>
    <text class="tt ss" x="56" y="366">Lumen and VSM kept for comparison · sky, water reflection and missing assets stay art-directed.</text>
    <text class="tt ss" x="56" y="382">Verification is per-pixel on chosen frames, not a full-scene error bound.</text>
  </g>

  <text class="tt ss" x="640" y="352">Reading the chain: a solid link is a measurement you can re-run; a dashed link is a model that could be wrong;</text>
  <text class="tt ss" x="640" y="370">a dotted link is a choice. The final link is only as strong as the weakest one it depends on.</text>
</svg>
