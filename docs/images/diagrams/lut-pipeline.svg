<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">LUT bake pipeline and strip layout</title>
  <desc id="dsc">Seven bake stages from sRGB decode to the 1024 by 32 strip, with ACES off by default and the reason annotated. The lower half shows the strip layout: one block per blue slice, rows for green, columns for red, and the two-fetch manual trilinear lookup used by the material.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#57606A"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#BC4C00"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #F7F8FA; }
    .tt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #161B22; }
    .h1 { font-size: 24px; font-weight: 700; }
    .sub { font-size: 12px; fill: #57606A; }
    .st { font-size: 12px; font-weight: 700; }
    .b { font-size: 10.3px; fill: #57606A; }
    .mono { font-family: Consolas, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #24292F; }
    .notes { font-size: 10.6px; fill: #3D444D; }
    .step { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1.4; }
    .stepOpt { fill: #FFF6EC; stroke: #BC4C00; stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; }
    .note { fill: #FFF6EC; stroke: #D79B63; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .flow { stroke: #57606A; stroke-width: 1.6; fill: none; }
    .strip { fill: #FFFFFF; stroke: #57606A; stroke-width: 1.4; }
    .div { stroke: #C9D1D9; stroke-width: 1; }
    .pick { fill: #EAF2FF; stroke: #1F6FEB; stroke-width: 1.3; }
    .grid { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1; }
    .cell { fill: #FFF1E0; stroke: #BC4C00; stroke-width: 1.1; }
    .rule { stroke: #E3E7EC; stroke-width: 1.1; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="520"/>

  <text class="tt h1" x="40" y="40">LUT bake pipeline — 32³ table packed as a 1024 × 32 strip</text>
  <text class="tt sub" x="40" y="62">Offline bake in Node, one function per stage. The UE material only does the final lookup.</text>

  <!-- ===== stage boxes ===== -->
  <g>
    <rect class="step" x="40" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="54" y="118">1 · sRGB decode</text>
    <text class="tt b" x="54" y="142">8-bit sRGB -&gt; linear</text>
    <text class="tt b" x="54" y="158">per channel, no LUT</text>
    <text class="tt mono" x="54" y="182">ps1105708 stage 1</text>
  </g>
  <line class="flow" x1="245" y1="152" x2="255" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="stepOpt" x="259" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="273" y="118">2 · ACES</text>
    <text class="tt b" x="273" y="142">Narkowicz fit</text>
    <text class="tt b" x="273" y="158" fill="#9A3F00">default OFF (aces=0)</text>
    <text class="tt mono" x="273" y="182">optional stage</text>
  </g>
  <line class="flow" x1="464" y1="152" x2="474" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="step" x="478" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="492" y="118">3 · Daylight WB</text>
    <text class="tt b" x="492" y="142">kelvin -&gt; RGB gains</text>
    <text class="tt b" x="492" y="158">D-series locus, normalised</text>
    <text class="tt mono" x="492" y="182">cb0[47].x = kelvin</text>
  </g>
  <line class="flow" x1="683" y1="152" x2="693" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="step" x="697" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="711" y="118">4 · 3 × 3 grade</text>
    <text class="tt b" x="711" y="142">mode 3 / 8 / 9</text>
    <text class="tt b" x="711" y="158">linear RGB matrix</text>
    <text class="tt mono" x="711" y="182">cb0[74].z = mode</text>
  </g>
  <line class="flow" x1="902" y1="152" x2="912" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="step" x="916" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="930" y="118">5 · × 0.952381</text>
    <text class="tt b" x="930" y="142">= 1 / 1.05</text>
    <text class="tt b" x="930" y="158">exposure normalisation</text>
    <text class="tt mono" x="930" y="182">source constant</text>
  </g>
  <line class="flow" x1="1121" y1="152" x2="1131" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="step" x="1135" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="1149" y="118">6 · midLift</text>
    <text class="tt b" x="1149" y="142">0 at v = 0 and v = 1</text>
    <text class="tt b" x="1149" y="158">peak ×1.16-1.24, luma 85-170</text>
    <text class="tt mono" x="1149" y="182">empirical, not decoded</text>
  </g>
  <line class="flow" x1="1340" y1="152" x2="1350" y2="152" marker-end="url(#ar)"/>

  <g>
    <rect class="step" x="1354" y="92" width="201" height="120" rx="6"/>
    <text class="tt st" x="1368" y="118">7 · Encode strip</text>
    <text class="tt b" x="1368" y="142">1024 × 32, 8-bit RGB</text>
    <text class="tt b" x="1368" y="158">R fastest, B per block</text>
    <text class="tt mono" x="1368" y="182">T_LUT_MC_SuiBo</text>
  </g>

  <!-- ===== ACES annotation ===== -->
  <rect class="note" x="259" y="224" width="420" height="62" rx="5"/>
  <text class="tt notes" x="272" y="243">ACES is off by default: the runtime lookup happens after tonemapping,</text>
  <text class="tt notes" x="272" y="260">so the table already holds display-referred values. Baking ACES would</text>
  <text class="tt notes" x="272" y="277">tone-map twice. Use aces=1 only against a pre-tonemap bake.</text>
  <line x1="330" y1="212" x2="330" y2="224" stroke="#D79B63" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- midLift provenance -->
  <rect class="note" x="916" y="224" width="639" height="44" rx="5"/>
  <text class="tt notes" x="929" y="243">midLift is fitted to a before/after capture pair, not read from a constant:</text>
  <text class="tt notes" x="929" y="260">it lifts the mid-tones and holds black and white, so it is labelled as a judgement call.</text>
  <line x1="1150" y1="212" x2="1150" y2="224" stroke="#D79B63" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- ===== strip layout ===== -->
  <text class="tt st" x="40" y="310">Strip layout — one block per B slice, row = G, column = R</text>

  <rect class="strip" x="40" y="336" width="860" height="56"/>
  <path class="div" d="M66.88,336 V392 M93.75,336 V392 M120.63,336 V392 M147.5,336 V392 M174.38,336 V392 M201.25,336 V392 M228.13,336 V392 M255,336 V392 M281.88,336 V392 M308.75,336 V392 M335.63,336 V392 M362.5,336 V392 M389.38,336 V392 M416.25,336 V392 M443.13,336 V392 M470,336 V392 M496.88,336 V392 M523.75,336 V392 M550.63,336 V392 M577.5,336 V392 M604.38,336 V392 M631.25,336 V392 M658.13,336 V392 M685,336 V392 M711.88,336 V392 M738.75,336 V392 M765.63,336 V392 M792.5,336 V392 M819.38,336 V392 M846.25,336 V392 M873.13,336 V392"/>
  <rect class="pick" x="174.38" y="336" width="26.875" height="56"/>
  <rect class="pick" x="201.25" y="336" width="26.875" height="56"/>
  <text class="tt mono" x="187.8" y="330" text-anchor="middle" fill="#1257C4">s0</text>
  <text class="tt mono" x="214.7" y="330" text-anchor="middle" fill="#1257C4">s1</text>

  <text class="tt mono" x="40" y="408">B = 0</text>
  <text class="tt mono" x="900" y="408" text-anchor="end">B = 31</text>
  <line class="flow" x1="40" y1="424" x2="896" y2="424" marker-end="url(#ar)"/>
  <text class="tt b" x="40" y="440">B increases to the right; each block is 32 texels wide (R) and 32 texels tall (G).</text>

  <!-- zoom: two blocks -->
  <text class="tt mono" x="950" y="314">B = s0 = floor(b × 31)</text>
  <text class="tt mono" x="1130" y="314">B = s1 = min(s0 + 1, 31)</text>

  <g>
    <!-- block A grid 8x8, 20 px cells -->
    <rect class="grid" x="950" y="320" width="160" height="160"/>
    <path class="div" d="M970,320 V480 M990,320 V480 M1010,320 V480 M1030,320 V480 M1050,320 V480 M1070,320 V480 M1090,320 V480 M950,340 H1110 M950,360 H1110 M950,380 H1110 M950,400 H1110 M950,420 H1110 M950,440 H1110 M950,460 H1110"/>
    <rect class="cell" x="1010" y="420" width="20" height="20"/>
    <circle class="dotFar" cx="1020" cy="430" r="4" fill="#BC4C00"/>

    <!-- block B -->
    <rect class="grid" x="1130" y="320" width="160" height="160"/>
    <path class="div" d="M1150,320 V480 M1170,320 V480 M1190,320 V480 M1210,320 V480 M1230,320 V480 M1250,320 V480 M1270,320 V480 M1130,340 H1290 M1130,360 H1290 M1130,380 H1290 M1130,400 H1290 M1130,420 H1290 M1130,440 H1290 M1130,460 H1290"/>
    <rect class="cell" x="1190" y="420" width="20" height="20"/>
    <circle class="dotFar" cx="1200" cy="430" r="4" fill="#BC4C00"/>
  </g>

  <text class="tt b" x="950" y="496">8 × 8 cells shown; the real block is 32 × 32.</text>
  <text class="tt b" x="950" y="512">column = R index · row = G index · one column pair = one B slice</text>

  <!-- formulas -->
  <line class="rule" x1="1310" y1="316" x2="1310" y2="470"/>

  <g class="tt mono">
    <text x="1326" y="336">u0 = (s0·32 + r·31 + 0.5) / 1024</text>
    <text x="1326" y="358">u1 = (s1·32 + r·31 + 0.5) / 1024</text>
    <text x="1326" y="380">v  = (g·31 + 0.5) / 32</text>
    <text x="1326" y="402">t  = b·31 - s0</text>
    <text x="1326" y="424">graded = lerp(tex(u0,v), tex(u1,v), t)</text>
  </g>
  <text class="tt b" x="1326" y="450">2 point fetches, LOD 0:</text>
  <text class="tt b" x="1326" y="466">manual trilinear in the material</text>

  <!-- ===== bottom notes ===== -->
  <text class="tt notes" x="40" y="472">GPU lookup vs CPU bake: max |delta| 0.7-1.0 / 255. The strip is 8-bit, so that is the quantisation floor, not a shading difference.</text>
</svg>
