; ============================================================================
; 这是摘录，不是完整 DefaultEngine.ini。
;
; 本文件只保留与《鸣潮》水岸高塔场景光照还原相关的渲染设置，
; 省略了项目标识、平台/打包配置、插件列表、分辨率与窗口设置，
; 以及安全令牌、项目 ID、移动端文件服务等字段。
; 请勿用本文件覆盖工程的 Config/DefaultEngine.ini。
;
; 对应引擎：Unreal Engine 5.8
; 说明：r.Substrate 在还原工程中由 True 改为 False（全工程材质均未使用
;       SubstrateSlabBSDF），该改动需重启编辑器生效。
; ============================================================================

[/Script/Engine.RendererSettings]

; 关闭自动曝光，保证对比图不受眼睛适应影响
r.DefaultFeature.AutoExposure=False

; 保留 Lumen 做对照：动态全局光照 + 反射
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

; 保留虚拟阴影贴图（VSM），并与 CSM 做参数对照
r.Shadow.Virtual.Enable=1

; 不使用静态光照，全部为动态光照
r.AllowStaticLighting=False

; Substrate 在本工程中为空开关，关闭以减少变量
r.Substrate=False
r.Substrate.ProjectGBufferFormat=0

; 光线追踪与网格距离场（Lumen / 反射 / 阴影需要）
r.RayTracing=True
r.GenerateMeshDistanceFields=True

; 蒙皮缓存着色器，供带骨骼的场景资产使用
r.SkinCache.CompileShaders=True
